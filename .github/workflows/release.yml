name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'

      - run: pnpm install

      - name: Release
        run: bin/release.sh "${{ github.event.inputs.tag || github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
